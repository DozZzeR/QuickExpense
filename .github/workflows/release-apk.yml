name: Build and publish debug APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# Least privilege by default; only the release job below gets write access.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a commit SHA (tag in the comment): a tag can be
      # moved to point at different code, a SHA can't.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Full history: versionCode is the commit count (see app/build.gradle.kts).
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        id: apk
        run: |
          apk_path=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: apk
          path: apk

      - name: Determine release tag
        id: tag
        # Values go through env, never straight into the script: a ${{ }} expression is
        # pasted into the shell source verbatim, so a crafted tag name would be executed.
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            echo "name=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=dev-build-$RUN_NUMBER" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          prerelease: ${{ github.ref_type != 'tag' }}
          files: apk/*.apk
