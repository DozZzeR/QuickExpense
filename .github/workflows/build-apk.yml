name: Build debug APK

# Builds a debug APK and republishes it to a rolling "latest-build" GitHub
# Release under a fixed asset name, so the download link never changes:
#   https://github.com/<owner>/<repo>/releases/latest/download/quickexpense-debug.apk
#
# Triggers automatically on push to main, or on demand for any branch via
# the "Run workflow" button on the Actions tab (pick the branch there).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build debug APK
        # Invoked via `sh` (not `./gradlew`) so it doesn't depend on the
        # wrapper script's executable bit, which git checkouts made on
        # Windows tend to drop.
        run: sh gradlew assembleDebug --no-daemon

      - name: Collect build info
        id: info
        run: |
          apk_path=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Rename APK to a stable filename
        run: cp "${{ steps.info.outputs.apk_path }}" quickexpense-debug.apk

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build quickexpense-debug.apk \
            --title "Latest build (${{ github.ref_name }} @ ${{ steps.info.outputs.short_sha }})" \
            --notes "Auto-built by GitHub Actions from commit ${{ github.sha }} on \`${{ github.ref_name }}\`." \
            --latest
