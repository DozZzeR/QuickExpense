name: Build debug APK

# Builds a debug APK and republishes it to a rolling "latest-build" GitHub
# Release under a fixed asset name, so the download link never changes:
#   https://github.com/<owner>/<repo>/releases/latest/download/quickexpense-debug.apk
#
# Triggers automatically on push to main, or on demand for any branch via
# the "Run workflow" button on the Actions tab (pick the branch there).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs (tag in the comment), as in release-apk.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Full history: versionCode is the commit count (see app/build.gradle.kts).
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build debug APK
        # Invoked via `sh` (not `./gradlew`) so it doesn't depend on the
        # wrapper script's executable bit, which git checkouts made on
        # Windows tend to drop.
        run: sh gradlew assembleDebug --no-daemon

      - name: Collect build info
        id: info
        run: |
          apk_path=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Rename APK to a stable filename
        env:
          APK_PATH: ${{ steps.info.outputs.apk_path }}
        run: cp "$APK_PATH" quickexpense-debug.apk

      - name: Publish rolling release
        # Branch names reach the shell through env, never via ${{ }} pasted into the script
        # (workflow_dispatch runs on any branch, and branch names can contain shell syntax).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SHORT_SHA: ${{ steps.info.outputs.short_sha }}
          FULL_SHA: ${{ github.sha }}
        run: |
          gh release delete latest-build --yes --cleanup-tag || true
          gh release create latest-build quickexpense-debug.apk \
            --title "Latest build ($REF_NAME @ $SHORT_SHA)" \
            --notes "Auto-built by GitHub Actions from commit $FULL_SHA on \`$REF_NAME\`." \
            --latest
